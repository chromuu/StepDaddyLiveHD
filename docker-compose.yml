services:
  step-daddy-live-hd:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT}
        API_URL: ${API_URL}
        PROXY_CONTENT: ${PROXY_CONTENT}
        SOCKS5: ${SOCKS5}
    security_opt:
      - no-new-privileges=true
    environment:
      - PORT=${PORT}
      - API_URL=${API_URL}
      - PROXY_CONTENT=${PROXY_CONTENT}
      - SOCKS5=${SOCKS5}
      - BACKEND_PORT=${BACKEND_PORT}
      - IMPERSONATE=${IMPERSONATE:-chrome136}
    ports:
      - "${PORT}:${PORT}"
    restart: always
    env_file:
      - .env
    container_name: step-daddy-live-hd
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${PORT:-3535}/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      retries: 3
      start_period: 120s
